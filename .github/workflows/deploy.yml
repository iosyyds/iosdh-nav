name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Cancel previous stuck deployments
        run: |
          echo "Checking for in-progress Pages deployments..."
          DEPLOYMENTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments?per_page=10" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(str(x['id']) for x in d if x.get('status')=='in_progress'))" 2>/dev/null || echo "")
          if [ -n "$DEPLOYMENTS" ]; then
            for DEP_ID in $DEPLOYMENTS; do
              echo "Canceling stuck deployment: $DEP_ID"
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$DEP_ID/cancel" || true
            done
            sleep 5
          else
            echo "No stuck deployments found."
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
